name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff mypy
      - name: Test
        run: PYTHONPATH=. python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        # The HA adapter is type-checked by the pinned HA/Hassfest gate when
        # that runtime is available; this job covers the HA-independent core.
        run: mypy bike_weather_core
      - name: Compile Python
        run: python -m compileall -q bike_weather_core custom_components/bike_weather tests

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          detect --source=/repo --no-git --redact --exit-code=1
