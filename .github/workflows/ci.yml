name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Install test tools
        run: python -m pip install --upgrade pytest ruff mypy voluptuous homeassistant==2026.10.1
      - name: Test
        run: PYTHONPATH=. python -m pytest -q
      - name: Ruff
        run: ruff check .
      - name: Mypy
        # The HA adapter is type-checked by the pinned HA/Hassfest gate when
        # that runtime is available; this job covers the HA-independent core.
        run: mypy bike_weather_core
      - name: Compile Python
        run: python -m compileall -q bike_weather_core custom_components/bike_weather tests

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: JavaScript syntax
        run: node --check custom_components/bike_weather/www/bike-weather-card.js
      - name: Card interaction test
        run: node tests/test_phase9d_card.mjs

  ha-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - name: Install pinned Home Assistant fixture
        run: python -m pip install --upgrade pytest voluptuous homeassistant==2026.10.1
      - name: Verify exact HA WebSocket adapter behavior
        run: >-
          PYTHONPATH=. python -m pytest -q
          tests/test_phase9d_api.py tests/test_phase9c_runtime.py

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: >-
          docker run --rm -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.0
          detect --source=/repo --no-git --redact --exit-code=1
